name: Repair remaining build blockers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'fix(ci): apply remaining Godot Android repairs') }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic repairs
        shell: sh
        run: |
          set -eu
          sed -i 's/var countries := global_map.countries_by_continent(selected_continent)/var countries: Array = global_map.countries_by_continent(selected_continent)/' scripts/content_controller.gd
          sed -i 's/var unlocked := global_map.is_unlocked(country_name)/var unlocked: bool = global_map.is_unlocked(country_name)/' scripts/content_controller.gd
          sed -i 's/var completed := save.is_operation_completed(selected_country, i)/var completed: bool = save.is_operation_completed(selected_country, i)/' scripts/content_controller.gd
          sed -i 's/var waves := controller.get("waves")/var waves: Node = controller.get("waves")/' scripts/game_polish_manager.gd
          sed -i 's/var mission := controller.get("mission")/var mission: Node = controller.get("mission")/' scripts/game_polish_manager.gd
          sed -i 's/var layer := player.get("mobile_controls")/var layer: Control = player.get("mobile_controls")/' scripts/game_polish_manager.gd
          sed -i 's/var map_open := is_instance_valid(map_menu) and map_menu.visible/var map_open: bool = is_instance_valid(map_menu) and map_menu.visible/' scripts/game_polish_manager.gd
          sed -i 's/\[node name="GamePolishManager" type="Node"\]/[node name="GamePolishManager" type="Node" parent="."]/' main.tscn
          sed -i 's/\[node name="UpdateManager" type="Node"\]/[node name="UpdateManager" type="Node" parent="."]/' main.tscn
          sed -i 's/android:name="androidx.core.content.FileProvider"/android:name="com.operasyonturkiye.ota.OperasyonTurkiyeFileProvider"/' android_ota/plugin/src/main/AndroidManifest.xml
          sed -i '/tools:replace="android:resource"/d' android_ota/plugin/src/main/AndroidManifest.xml
          sed -i 's/            tools:replace="android:authorities">/            >/' android_ota/plugin/src/main/AndroidManifest.xml
          cat > android_ota/plugin/src/main/java/com/operasyonturkiye/ota/OperasyonTurkiyeFileProvider.java <<'EOF'
package com.operasyonturkiye.ota;

public class OperasyonTurkiyeFileProvider extends androidx.core.content.FileProvider {
}
EOF
          sed -i '/import androidx.core.content.FileProvider;/d' android_ota/plugin/src/main/java/com/operasyonturkiye/ota/GodotAndroidPlugin.java
          sed -i 's/FileProvider\.getUriForFile(/OperasyonTurkiyeFileProvider.getUriForFile(/' android_ota/plugin/src/main/java/com/operasyonturkiye/ota/GodotAndroidPlugin.java
      - name: Validate changes
        run: |
          set -eu
          grep -q 'var countries: Array' scripts/content_controller.gd
          grep -q 'var unlocked: bool' scripts/content_controller.gd
          grep -q 'var completed: bool' scripts/content_controller.gd
          grep -q 'file.get_length()' scripts/update_manager.gd
          grep -q 'var waves: Node' scripts/game_polish_manager.gd
          grep -q 'var mission: Node' scripts/game_polish_manager.gd
          grep -q 'var map_open: bool' scripts/game_polish_manager.gd
          grep -q 'parent="."' main.tscn
          grep -q 'OperasyonTurkiyeFileProvider' android_ota/plugin/src/main/AndroidManifest.xml
          grep -q 'OperasyonTurkiyeFileProvider.getUriForFile' android_ota/plugin/src/main/java/com/operasyonturkiye/ota/GodotAndroidPlugin.java
          test -s android_ota/plugin/src/main/java/com/operasyonturkiye/ota/OperasyonTurkiyeFileProvider.java
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/content_controller.gd scripts/update_manager.gd scripts/game_polish_manager.gd main.tscn android_ota/plugin/src/main/AndroidManifest.xml android_ota/plugin/src/main/java/com/operasyonturkiye/ota/GodotAndroidPlugin.java android_ota/plugin/src/main/java/com/operasyonturkiye/ota/OperasyonTurkiyeFileProvider.java
          git diff --cached --quiet || git commit -m 'fix(ci): apply remaining Godot Android repairs'
          git push
