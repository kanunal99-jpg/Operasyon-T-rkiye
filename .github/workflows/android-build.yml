name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Normalize Godot source before export
        shell: sh
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Missing expected text in {path}: {old!r}")
              p.write_text(s.replace(old, new), encoding="utf-8")

          replace("scripts/content_controller.gd", "var countries := global_map.countries_by_continent(selected_continent)", "var countries: Array = global_map.countries_by_continent(selected_continent)")
          replace("scripts/content_controller.gd", "var unlocked := global_map.is_unlocked(country_name)", "var unlocked: bool = global_map.is_unlocked(country_name)")
          replace("scripts/content_controller.gd", "var completed := save.is_operation_completed(selected_country, i)", "var completed: bool = save.is_operation_completed(selected_country, i)")
          replace("main.tscn", '[node name="GamePolishManager" type="Node"]', '[node name="GamePolishManager" type="Node" parent="."]')
          replace("main.tscn", '[node name="UpdateManager" type="Node"]', '[node name="UpdateManager" type="Node" parent="."]')

          checks = [
              ("scripts/content_controller.gd", "var countries: Array"),
              ("scripts/content_controller.gd", "var unlocked: bool"),
              ("scripts/content_controller.gd", "var completed: bool"),
              ("scripts/update_manager.gd", "var file := FileAccess.open(download_path, FileAccess.READ)"),
              ("scripts/game_polish_manager.gd", "var waves: Node"),
              ("scripts/game_polish_manager.gd", "var mission: Node"),
              ("scripts/game_polish_manager.gd", "var layer: Control"),
              ("scripts/game_polish_manager.gd", "var map_open: bool"),
              ("main.tscn", '[node name="GamePolishManager" type="Node" parent="."]'),
              ("main.tscn", '[node name="UpdateManager" type="Node" parent="."]'),
          ]
          for path, needle in checks:
              if needle not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"Repair verification failed: {path}: {needle!r}")
          print("Godot source normalization verified.")
          PY

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test -d "$JAVA_HOME"
          java -version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          test -d "$ANDROID_SDK_ROOT/cmake/3.10.2.4988404"

      - name: Configure Godot 4.3 Android editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          test -f ~/.config/godot/editor_settings-4.3.tres
          test -f /root/debug.keystore
          grep -q 'export/android/android_sdk_path = "/usr/lib/android-sdk"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/force_system_user = false' ~/.config/godot/editor_settings-4.3.tres

      - name: Build OTA Android plugin
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile OTA plugin AAR
        working-directory: android_ota
        run: |
          gradle --no-daemon --stacktrace :plugin:assemble
          test -s plugin/build/outputs/aar/OperasyonTurkiyeOTA-debug.aar
          test -s plugin/build/outputs/aar/OperasyonTurkiyeOTA-release.aar
          mkdir -p ../addons/OperasyonTurkiyeOTA/bin/debug ../addons/OperasyonTurkiyeOTA/bin/release
          cp plugin/build/outputs/aar/OperasyonTurkiyeOTA-debug.aar ../addons/OperasyonTurkiyeOTA/bin/debug/
          cp plugin/build/outputs/aar/OperasyonTurkiyeOTA-release.aar ../addons/OperasyonTurkiyeOTA/bin/release/
          test -s ../addons/OperasyonTurkiyeOTA/bin/debug/OperasyonTurkiyeOTA-debug.aar
          test -s ../addons/OperasyonTurkiyeOTA/bin/release/OperasyonTurkiyeOTA-release.aar

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_release.apk
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_source.zip
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. ~/.local/share/godot/export_templates/4.3.stable/
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_release.apk
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_source.zip

      - name: Set release version
        run: |
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          sed -i "s/version\/code=[0-9]*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/version\/name=\"[^\"]*\"/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          sed -i "s/const CURRENT_VERSION := \"[^\"]*\"/const CURRENT_VERSION := \"${VERSION_NAME}\"/" scripts/update_manager.gd
          grep -q "version/code=${GITHUB_RUN_NUMBER}" export_presets.cfg
          grep -q "version/name=\"${VERSION_NAME}\"" export_presets.cfg
          grep -q "const CURRENT_VERSION := \"${VERSION_NAME}\"" scripts/update_manager.gd
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION_NAME}"
          echo "Updater version: ${VERSION_NAME}"

      - name: Install Godot Android Gradle build template
        run: |
          mkdir -p build
          godot --headless --path . --install-android-build-template --export-debug "Android" build/bootstrap.apk
          test -f android/build.gradle
          test -d android/build
          test -s build/bootstrap.apk

      - name: Import project
        run: |
          rm -rf .godot
          godot --headless --editor --path . --import --quit

      - name: Validate Android OTA export setup
        run: |
          test -f export_presets.cfg
          grep -q '^platform="Android"' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -q 'package/signed=true' export_presets.cfg
          grep -q 'permissions/internet=true' export_presets.cfg
          grep -q 'permissions/request_install_packages=true' export_presets.cfg
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          grep -q 'res://addons/OperasyonTurkiyeOTA/plugin.cfg' project.godot
          test -f addons/OperasyonTurkiyeOTA/plugin.cfg
          test -f addons/OperasyonTurkiyeOTA/export_plugin.gd
          test -s addons/OperasyonTurkiyeOTA/bin/debug/OperasyonTurkiyeOTA-debug.aar
          test -s addons/OperasyonTurkiyeOTA/bin/release/OperasyonTurkiyeOTA-release.aar
          test -f android/build.gradle
          test -f ~/.config/godot/editor_settings-4.3.tres
          test -f /root/debug.keystore
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_source.zip
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          echo "Godot 4.3 Android Gradle + OTA plugin configuration validated."

      - name: Gameplay smoke test
        run: |
          godot --headless --path . --script res://scripts/ci_smoke_test.gd

      - name: Build debug APK
        run: |
          mkdir -p build
          echo "Godot: $(godot --version)"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Java SDK: $JAVA_HOME"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" --version
          godot --headless --verbose --path . --export-debug "Android" build/Operasyon-Turkiye-debug.apk

      - name: Verify APK
        run: |
          test -s build/Operasyon-Turkiye-debug.apk
          unzip -t build/Operasyon-Turkiye-debug.apk >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging build/Operasyon-Turkiye-debug.apk | grep -q 'package:'
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --min-sdk-version 24 build/Operasyon-Turkiye-debug.apk
          echo "APK export and Android signature verified successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Operasyon-Turkiye-Android
          path: build/Operasyon-Turkiye-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Operasyon Türkiye ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: build/Operasyon-Turkiye-debug.apk
