name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  GODOT_VERSION: 4.3-stable
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize Godot source before export
        shell: sh
        run: |
          set -eu
          sed -i 's/var countries :=/var countries: Array =/' scripts/content_controller.gd
          sed -i 's/var unlocked :=/var unlocked: bool =/' scripts/content_controller.gd
          sed -i 's/var completed :=/var completed: bool =/' scripts/content_controller.gd
          sed -i 's/var waves :=/var waves: Node =/' scripts/game_polish_manager.gd
          sed -i 's/var mission :=/var mission: Node =/' scripts/game_polish_manager.gd
          sed -i 's/var layer :=/var layer: Control =/' scripts/game_polish_manager.gd
          sed -i 's/var map_open :=/var map_open: bool =/' scripts/game_polish_manager.gd
          sed -i 's/\[node name="GamePolishManager" type="Node"\]/[node name="GamePolishManager" type="Node" parent="."]/' main.tscn
          sed -i 's/\[node name="UpdateManager" type="Node"\]/[node name="UpdateManager" type="Node" parent="."]/' main.tscn
      - name: Prepare Android SDK
        shell: sh
        run: |
          set -eu
          mkdir -p "$HOME/.android"
          printf '%s\n' 'count=0' > "$HOME/.android/repositories.cfg"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Configure Godot 4.3 Android editor settings
        shell: sh
        run: |
          set -eu
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "/opt/java/openjdk"
          EOF
      - name: Build OTA Android plugin
        shell: sh
        run: |
          set -eu
          cd android_ota
          gradle wrapper --gradle-version 8.2 --distribution-type bin
      - name: Compile OTA plugin AAR
        shell: sh
        run: |
          set -eu
          cd android_ota
          ./gradlew :plugin:assembleRelease --no-daemon
          test -f plugin/build/outputs/aar/OperasyonTurkiyeOTA-release.aar
      - name: Prepare Godot export templates
        shell: sh
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ]; then
            curl -L --fail --retry 3 -o /tmp/godot_export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q -o /tmp/godot_export_templates.tpz -d /tmp/godot_templates
            cp -r /tmp/godot_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          fi
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Set release version
        shell: sh
        run: |
          set -eu
          sed -i "s/CURRENT_VERSION := \"[0-9.]*\"/CURRENT_VERSION := \"0.1.${GITHUB_RUN_NUMBER}\"/" scripts/update_manager.gd
      - name: Install Godot Android Gradle build template
        shell: sh
        run: |
          set -eu
          godot --headless --path . --editor --install-android-build-template
          test -d android/build
          test -f android/build.gradle
      - name: Import project
        shell: sh
        run: godot --headless --path . --editor --import --quit
      - name: Validate Android OTA export setup
        shell: sh
        run: |
          set -eu
          test -f android_ota/plugin/build/outputs/aar/OperasyonTurkiyeOTA-release.aar
          test -f android/build.gradle
      - name: Gameplay smoke test
        shell: sh
        run: |
          set -eu
          godot --headless --path . --editor --quit
          godot --headless --path . --quit-after 3
      - name: Build debug APK
        shell: sh
        run: |
          set -eu
          mkdir -p build
          godot --headless --path . --export-debug 'Android' build/OperasyonTurkiye-debug.apk
          test -s build/OperasyonTurkiye-debug.apk
      - name: Verify APK
        shell: sh
        run: |
          set -eu
          file build/OperasyonTurkiye-debug.apk
          unzip -tq build/OperasyonTurkiye-debug.apk
          test "$(stat -c%s build/OperasyonTurkiye-debug.apk)" -gt 100000
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperasyonTurkiye-debug-apk
          path: build/OperasyonTurkiye-debug.apk
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Operasyon Türkiye v0.1.${{ github.run_number }}
          files: build/OperasyonTurkiye-debug.apk
