name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. ~/.config/godot/; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/; fi
          test -d ~/.local/share/godot/export_templates/4.3.stable

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Validate Android export setup
        run: |
          test -f export_presets.cfg
          grep -q '^platform="Android"' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=false' export_presets.cfg
          ! grep -q 'gradle_build/min_sdk=' export_presets.cfg
          ! grep -q 'gradle_build/target_sdk=' export_presets.cfg
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          echo "Godot 4.3 Android 34/34.0.0 export configuration validated."

      - name: Build debug APK
        run: |
          mkdir -p build
          echo "Using Android SDK: $ANDROID_SDK_ROOT"
          echo "Godot: $(godot --version)"
          echo "Build-tools 34.0.0:"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" --version
          godot --headless --verbose --path . --export-debug "Android" build/Operasyon-Turkiye-debug.apk

      - name: Verify APK
        run: |
          test -s build/Operasyon-Turkiye-debug.apk
          file build/Operasyon-Turkiye-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operasyon-Turkiye-Android
          path: build/Operasyon-Turkiye-debug.apk
          if-no-files-found: error
