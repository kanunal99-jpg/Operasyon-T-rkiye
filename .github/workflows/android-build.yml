name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then cp -a /root/.config/godot/. ~/.config/godot/; fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/; fi

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Install Android Gradle build template
        run: godot --headless --editor --quit --path . --install-android-build-template

      - name: Build debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Operasyon-Turkiye-debug.apk

      - name: Verify APK
        run: test -s build/Operasyon-Turkiye-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operasyon-Turkiye-Android
          path: build/Operasyon-Turkiye-debug.apk
          if-no-files-found: error
