name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_release.apk
          cp -a /root/.local/share/godot/export_templates/4.3.stable/. ~/.local/share/godot/export_templates/4.3.stable/
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_release.apk

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test -d "$JAVA_HOME"
          java -version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          test -d "$ANDROID_SDK_ROOT/cmake/3.10.2.4988404"

      - name: Configure Godot 4.3 Android editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          test -f ~/.config/godot/editor_settings-4.3.tres
          test -f /root/debug.keystore
          grep -q 'export/android/android_sdk_path = "/usr/lib/android-sdk"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/force_system_user = false' ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: |
          rm -rf .godot
          godot --headless --editor --path . --import --quit

      - name: Validate Android export setup
        run: |
          test -f export_presets.cfg
          grep -q '^platform="Android"' export_presets.cfg
          grep -q 'gradle_build/use_gradle_build=false' export_presets.cfg
          ! grep -q 'gradle_build/min_sdk=' export_presets.cfg
          ! grep -q 'gradle_build/target_sdk=' export_presets.cfg
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot
          test -f ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/android_sdk_path = "/usr/lib/android-sdk"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' ~/.config/godot/editor_settings-4.3.tres
          grep -q 'export/android/debug_keystore = "/root/debug.keystore"' ~/.config/godot/editor_settings-4.3.tres
          test -f /root/debug.keystore
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_release.apk
          test -d "$ANDROID_SDK_ROOT/platforms/android-34"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          test -d "$ANDROID_SDK_ROOT/cmake/3.10.2.4988404"
          echo "Godot 4.3 Android export configuration validated."

      - name: Build debug APK
        run: |
          mkdir -p build
          echo "Godot: $(godot --version)"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Java SDK: $JAVA_HOME"
          echo "Export templates:"
          ls -lh ~/.local/share/godot/export_templates/4.3.stable/android_*.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" --version
          godot --headless --verbose --path . --export-debug "Android" build/Operasyon-Turkiye-debug.apk

      - name: Verify APK
        run: |
          test -s build/Operasyon-Turkiye-debug.apk
          unzip -t build/Operasyon-Turkiye-debug.apk >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose build/Operasyon-Turkiye-debug.apk
          echo "APK export verified successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Operasyon-Turkiye-Android
          path: build/Operasyon-Turkiye-debug.apk
          if-no-files-found: error
