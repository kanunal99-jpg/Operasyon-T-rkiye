name: Repair CI

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ci): repair Godot 4.3 parse and manifest issues') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal Godot 4.3 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/content_controller.gd')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var countries := global_map.countries_by_continent(selected_continent)', 'var countries: Array = global_map.countries_by_continent(selected_continent)')
          s = s.replace('var country_name := str(item[0]); var capital := str(item[2]); var difficulty := int(item[3]); var unlocked := global_map.is_unlocked(country_name)', 'var country_name := str(item[0]); var capital := str(item[2]); var difficulty := int(item[3]); var unlocked: bool = global_map.is_unlocked(country_name)')
          s = s.replace('var completed := save.is_operation_completed(selected_country, i)', 'var completed: bool = save.is_operation_completed(selected_country, i)')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/update_manager.gd')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var file_size := FileAccess.get_length(download_path)', 'var file_size: int = FileAccess.get_size(ProjectSettings.globalize_path(download_path))')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/game_polish_manager.gd')
          s = p.read_text(encoding='utf-8')
          s = s.replace('var waves := controller.get("waves")', 'var waves: Node = controller.get("waves")')
          s = s.replace('var mission := controller.get("mission")', 'var mission: Node = controller.get("mission")')
          s = s.replace('var map_open := is_instance_valid(map_menu) and map_menu.visible', 'var map_open: bool = is_instance_valid(map_menu) and map_menu.visible')
          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          files = ['scripts/content_controller.gd', 'scripts/update_manager.gd', 'scripts/game_polish_manager.gd']
          for f in files:
              text = Path(f).read_text(encoding='utf-8')
              if '\ufeff' in text:
                  raise SystemExit(f'{f}: unexpected BOM')
          print('Godot 4.3 source fixes applied.')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/content_controller.gd scripts/update_manager.gd scripts/game_polish_manager.gd
          if git diff --cached --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git commit -m "chore(ci): repair Godot 4.3 parse and manifest issues"
          git push

      - name: Dispatch Android Build on repaired commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/android-build.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Android Build dispatched on repaired main." 
